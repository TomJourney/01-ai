<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5分钟倒计时</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; background: #1a1a2e; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .container { text-align: center; }
  .timer {
    font-size: 120px; font-weight: 700; color: #e94560;
    font-variant-numeric: tabular-nums; margin-bottom: 40px;
    text-shadow: 0 0 40px rgba(233, 69, 96, 0.4);
  }
  .timer.warning { color: #f0a500; text-shadow: 0 0 40px rgba(240, 165, 0, 0.4); }
  .buttons { display: flex; gap: 16px; justify-content: center; }
  button {
    padding: 14px 36px; font-size: 18px; border: none; border-radius: 10px;
    cursor: pointer; font-weight: 600; transition: transform 0.15s, opacity 0.15s;
  }
  button:hover { transform: scale(1.05); }
  button:active { transform: scale(0.97); }
  .start { background: #0f3460; color: #e94560; }
  .pause { background: #0f3460; color: #f0a500; }
  .reset { background: #0f3460; color: #16c79a; }
</style>
</head>
<body>
<div class="container">
  <div class="timer" id="timer">05:00</div>
  <div class="buttons">
    <button class="start" id="startBtn">开始</button>
    <button class="pause" id="pauseBtn">暂停</button>
    <button class="reset" id="resetBtn">重置</button>
  </div>
</div>
<script>
const timerEl = document.getElementById('timer');
const startBtn = document.getElementById('startBtn');
const pauseBtn = document.getElementById('pauseBtn');
const resetBtn = document.getElementById('resetBtn');

const TOTAL = 5 * 60;
let remaining = TOTAL;
let intervalId = null;

function format(seconds) {
  const m = String(Math.floor(seconds / 60)).padStart(2, '0');
  const s = String(seconds % 60).padStart(2, '0');
  return `${m}:${s}`;
}

function updateDisplay() {
  timerEl.textContent = format(remaining);
  timerEl.classList.toggle('warning', remaining <= 60);
}

function start() {
  if (intervalId) return;
  intervalId = setInterval(() => {
    remaining--;
    updateDisplay();
    if (remaining <= 0) {
      clearInterval(intervalId);
      intervalId = null;
    }
  }, 1000);
}

function pause() {
  clearInterval(intervalId);
  intervalId = null;
}

function reset() {
  pause();
  remaining = TOTAL;
  updateDisplay();
}

startBtn.addEventListener('click', start);
pauseBtn.addEventListener('click', pause);
resetBtn.addEventListener('click', reset);

updateDisplay();
</script>
</body>
</html>
